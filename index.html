<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Globe</title>
<style>
  :root { --bg:#060a1c; --land:#7ff0c8; --ocean:#1b4a9a; --glow:#3aa0ff; --text:#cfe3ff; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:radial-gradient(circle at 50% 40%, #0d1a40 0%, var(--bg) 70%); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:12px; }
  #wrap { width:min(92vw,78vh,640px); aspect-ratio:1; position:relative; }
  canvas { width:100%; height:100%; cursor:grab; touch-action:none; display:block; }
  canvas.drag { cursor:grabbing; }
  .hint { font-size:13px; opacity:.7; letter-spacing:.03em; text-align:center; }
  .tip { position:absolute; pointer-events:none; padding:4px 9px; border-radius:6px; background:rgba(10,20,50,.9); border:1px solid rgba(90,170,255,.5); font-size:12px; white-space:nowrap; transform:translate(-50%,-140%); opacity:0; transition:opacity .15s; }
  .controls { display:flex; gap:8px; }
  button { background:rgba(60,130,255,.15); color:var(--text); border:1px solid rgba(90,170,255,.45); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; }
  button:hover { background:rgba(60,130,255,.3); }
</style>
</head>
<body>
<main>
  <div id="wrap"><canvas id="g"></canvas><div class="tip" id="tip"></div></div>
  <div class="controls">
    <button id="spin">Pause spin</button>
    <button id="reset">Reset view</button>
  </div>
  <p class="hint">Drag to rotate · scroll or pinch to zoom · hover a marker</p>
</main>
<script>
// ---- Edit your markers here: [name, latitude, longitude] ----
const MARKERS = [
  ["India", 22.3, 73.2],
  ["London", 51.5, -0.12],
  ["New York", 40.7, -74.0],
  ["Tokyo", 35.7, 139.7],
  ["Sydney", -33.9, 151.2],
  ["São Paulo", -23.5, -46.6]
];
// -------------------------------------------------------------

const MASK_B64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADf//8AAf///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////H//////3+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////z////////wAAAAAPgAABwAAAAAAPwAAAAAAAAAAAAAAAAAAAAAAAAAAA///+A///////+AAAAB//wAAAAAAAAAAH8gAAAAAAAAAAAAAAAAAAAAAAAcH3Hv/w////////8AAAAA/kAAAAAAAAAAAAD4AAAAAAAAAAAAAAAAAAAAAA4YABwP/A////////+AAAAAPGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD4DAs+f+AP///////8AAAAAAAAAAAAAfwAAAAB/8AAAAAAAAAAAAAAAAAAAAAH/w83/8AAAf/////8AAAAAAAAAAAAH+AAAA////AAAB/gAAAAAAAAAAAAAAAAYAAw+8AAAH/////8AAAAAAAAAAAAeAAAAP///4AAAAAAAAAAAAAAAAAAAAf8AYc+YzAAAD/////4AAAAAAAAAAAA4AAAH/////+HgAGAAAAAAAAAAAAAAAf/+4+w//wAAB/////gAAAAAAAAAAADwAHkv///////4APwAAAAAwAAAAAAAAPf/4O4///AAB/////wAAAAAAAAAAADwAPP////////4///gAAAAAAAf/gAAAAH/+A8f//8AB////+wAAAAAAA/AAAAAAfv/////////////8AAAAAB///8H//H//neD4f+AA3////AAAAAAA//8AAAAcfv//////////////9P8gAP///////+A4Cfz4P+AAP///4AAAAAAD///4MDP/nn/////////////////8AD////////////34Z/wA///4AAAAAAAP///+M////v//////////////////4F////////////9gD/8A///wAQIAAAAf//9+P////f/////////////////n4f////////////6A/8YAf/4AA/8AAAA/8f+D///////////////////////AgIf///////////zw//AAP/wAAf8AAAB/4/+f//////////////////////+AEA////////////DYA/gAP/gAABAAAAH/z/////////////////////////+AAH///////////8AwwHAAD/AAAAAAAA//H/////////////////////////6AAP///////////4AA/AAAB+AAAAAAAB/+H//////////////////////nP+AAAH//z////////wAA/4AAAOAAAAAAAB//D7////////////////////+A/4AAAA/7AD///////wAA/4wAAAAAAAAAAB//gD////////////////////+DwAAAAADwAA///////4AA/94AAAAAAAAAQA5+A///////////////////4AAHgAAAAADYAAD//////8AAf/8AAAAAAAAA8AA+C///////////////////wAAfgAAAAAMAAAB///////wAf/+AAAAAAAAA8AO8H///////////////////AAA/gAAAABwAAAA///////+A///AAAAAAAAAcANwH//////////////////8AAB/AAAAACAAAAAf///////x///4AAAAAAAHOAED///////////////////+AAB+AAAAAAAAAABP///////x///8AAAAAAAHPA//////////////////////6AA8AAAAAAAAAAAD///////5///8AAAAAAAOfz//////////////////////+AA4AAAAAAAAAAAD///////9///8AAAAAAAAfn//////////////////////6AAwAAAAAAAAAAAD///////////MAAAAAAAAYf//////////////////////7AAAAAAAAAAAAAAB/////////+APAAAAAAAAD///////////////////////7AAAAAAAAAAAAAAAX////////7gfgAAAAAAAf///////////////////////yAAAAAAAAAAAAAAAP/////////gXgAAAAAAAH///////////////////////iAAAAAAAAAAAAAAAP/////////5AAAAAAAAAD//////P/h//////////////DAAAAAAAAAAAAAAAP/////////+AAAAAAAAAB/////Hf+B/////////////+AAAAAAAAAAAAAAAAP////////8wAAAAAAAAAB//n/+AP+H/////////////8GAAAAAAAAAAAAAAAP////////wgAAAAAAAAD//jz/8AD+H/////////////4HwAAAAAAAAAAAAAAP////////gAAAAAAAAAH/4F4/8AB/B////////////+APAAAAAAAAAAAAAAAP////////wAAAAAAAAAH/4A8f8Ph/g////////////8AIAAAAAAAAAAAAAAAP///////+AAAAAAAAAAH/gMHfP///x///////////v4AMAAAAAAAAAAAAAAAP///////8AAAAAAAAAAH/AMCOP///h//////////+ZwAMAAAAAAAAAAAAAAAH///////4AAAAAAAAAAP/AAGHP///g//////////8B4AYAAAAAAAAAAAAAAAH///////wAAAAAAAAAAH+AAcHH///w//////////+w4A4AAAAAAAAAAAAAAAD///////wAAAAAAAAAAAwf+ACD+//////////////g8D4AAAAAAAAAAAAAAAB///////wAAAAAAAAAAAx/+AAAE//////////////A4f4AAAAAAAAAAAAAAAA///////gAAAAAAAAAAB//+AAAA//////////////Aw/AAAAAAAAAAAAAAAAAP/////+AAAAAAAAAAAD//+AAAB//////////////gDwAAAAAAAAAAAAAAAAAH/////8AAAAAAAAAAAH///4GAB//////////////gDAAAAAAAAAAAAAAAAAAG/////4AAAAAAAAAAAP///8P4j//////////////wCAAAAAAAAAAAAAAAAAACf////4AAAAAAAAAAAP/////////////////////wAAAAAAAAAAAAAAAAAAABf//zgYAAAAAAAAAAAP/////////P///////////wAAAAAAAAAAAAAAAAAAAAv//AAYAAAAAAAAAAAf/////////n///////////wAAAAAAAAAAAAAAAAAAAB3/+AAcAAAAAAAAAAB///////9//j///////////gAAAAAAAAAAAAAAAAAAAAT/+AAMgAAAAAAAAAD///////8//wn//////////AAAAAAAAAAAAAAAAAAAAAJ/+AAEAAAAAAAAAAH///////+f/8b//////////AAAAAAAAAAAAAAAAAAAAAM/8AAAgAAAAAAAAAH///////+f/84Af///////+wAAAAAAAAAAAAAAAAAAAAGf8AAAAAAAAAAAAAP////////P//+AP///////4wAAAAAAAAAAAAAAAAAAAAAP8AA/AAAAAAAAAAf////////H///AH///////ggAAAAAAAAAAAAAAAAAAAAAP+AIBgAAAAAAAAAf////////n//+AD//8P//4AAAAAAAAAAAAAAAAAAAAAAAP+B4A4AAAAAAAAAf////////j//+AAf/4P/+IAAAAAAAAAAAAAAAgAAAAAAAH/B4AB4AAAAAAAAP////////h//8AAf/gH/8YAAAAAAAAAAAAAAAAAAAAAAAD/nwAj5AAAAAAAAP////////x//4AAf/AD/8QAQAAAAAAAAAAAAAAAAAAAAAA//wAAAAAAAAAAAP////////4//wAAf+AD/+AA4AAAAAAAAAAAAAAAAAAAAAAH/wAAAAAAAAAAAf////////4f+AAAf8AD//AAwAAAAAAAAAAAAAAAAAAAAAAAH/AAAAAAAAAAAf////////8f8AAAPwAAP/gAwAAAAAAAAAAAAAAAAAAAAAAAD/gAAAAAAAAAAf////////+fgAAAPwAAP/gAwAAAAAAAAAAAAAAAAAAAAAAAA/gAAAAAAAAAAf/////////eAAAAHwAAP/gAcAAAAAAAAAAAAAAAAAAAAAAAAHgAAAAAAAAAAf/////////4AAAAHwAAM/gACAAAAAAAAAAAAAAAAAAAAAAAADABoAAAAAAAAP/////////gYAAAHwAAMfgALAAAAAAAAAAAAAAAAAAAAAAAADgH/OAAAAAAAH//////////4AAADwAAIOABMAAAAAAAAAAAAAAAAAAAAAAAAByP/+AAAAAAAD//////////4AAADoAAIEACBAAAAAAAAAAAAAAAAAAAAAAAAA9///AAAAAAAB//////////wAAABIAAMAAAHAAAAAAAAAAAAAAAAAAAAAAAAAE///gAAAAAAB//////////wAAAAMAAGAAAPgAAAAAAAAAAAAAAAAAAAAAAAAA///wAAAAAAAf/////////gAAAAMAADAAMDAAAAAAAAAAAAAAAAAAAAAAAAAA////gAAAAAAP/B///////gAAAAAAADgAeAAAAAAAAAAAAAAAAAAAAAAAAAAAf///wAAAAAACAA///////AAAAAAAAzwA+AAAAAAAAAAAAAAAAAAAAAAAAAAA////4AAAAAAAAAH/////+AAAAAAAAZgB8AAAAAAAAAAAAAAAAAAAAAAAAAAA////4AAAAAAAAAD/////8AAAAAAAAMwH8AAAAAAAAAAAAAAAAAAAAAAAAAAB////8AAAAAAAAAH/////4AAAAAAAAHwf8AYAAAAAAAAAAAAAAAAAAAAAAAAD////8AAAAAAAAAH/////gAAAAAAAAHgf8+YAAAAAAAAAAAAAAAAAAAAAAAAH/////AAAAAAAAAH/////gAAAAAAAADwf9AAgAAAAAAAAAAAAAAAAAAAAAAAH/////4AAAAAAAAH/////AAAAAAAAAB4P54BwAAAAAAAAAAAAAAAAAAAAAAAH/////+AAAAAAAAD////+AAAAAAAAAB8P5wA74AAAAAAAAAAAAAAAAAAAAAAH//////4AAAAAAAB////8AAAAAAAAAA8Ax4of+AIAAAAAAAAAAAAAAAAAAAAH//////+AAAAAAAB////8AAAAAAAAAAcABoAH/wIAAAAAAAAAAAAAAAAAAAAH///////gAAAAAAA////4AAAAAAAAAAMAAIAA/xwAAAAAAAAAAAAAAAAAAAAH///////gAAAAAAA////4AAAAAAAAAADgAAAA/8BAAAAAAAAAAAAAAAAAAAAD///////gAAAAAAAf///4AAAAAAAAAAB+AAAA/4AAAAAAAAAAAAAAAAAAAAAB///////gAAAAAAAf///4AAAAAAAAAAADkhgAvMAAAAAAAAAAAAAAAAAAAAAB///////gAAAAAAAf///8AAAAAAAAAAAABiAAAHACAAAAAAAAAAAAAAAAAAAA///////AAAAAAAAf///8AAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAA//////+AAAAAAAAP///+AAAAAAAAAAAAAAAgCAAAAAAAAAAAAAAAAAAAAAAAf/////8AAAAAAAAf///+AQAAAAAAAAAAAAB+CAAAAAAAAAAAAAAAAAAAAAAAf/////4AAAAAAAA////+AwAAAAAAAAAAAAD8DAAAAAAAAAAAAAAAAAAAAAAAP/////4AAAAAAAA////+AwAAAAAAAAAAAB38DgAAAAAAAAAAAAAAAAAAAAAAH/////4AAAAAAAA////+DwAAAAAAAAAAAD/8HwAAAAAAAAAAAAAAAAAAAAAAB/////4AAAAAAAA////8PwAAAAAAAAAAAD//HwAAAABAAAAAAAAAAAAAAAAAA/////4AAAAAAAA////wPwAAAAAAAAAAAP///wAAAAGAAAAAAAAAAAAAAAAAAf////wAAAAAAAA////gPgAAAAAAAAAAAP///wAAAAAAAAAAAAAAAAAAAAAAAP////wAAAAAAAAf//+APgAAAAAAAAAAAf///8AAAAAAAAAAAAAAAAAAAAAAAP////wAAAAAAAAf//+APgAAAAAAAAAAH////+AAIAAAAAAAAAAAAAAAAAAAAP////gAAAAAAAAP//+AfAAAAAAAAAAAf////+AAGAAAAAAAAAAAAAAAAAAAAP////AAAAAAAAAP///AfAAAAAAAAAAA//////gAAAAAAAAAAAAAAAAAAAAAAf///4AAAAAAAAAP///AfAAAAAAAAAAA//////gAAAAAAAAAAAAAAAAAAAAAAf///gAAAAAAAAAP//+AOAAAAAAAAAAB//////wAAAAAAAAAAAAAAAAAAAAAAf///AAAAAAAAAAH//4AEAAAAAAAAAAA//////4AAAAAAAAAAAAAAAAAAAAAAf///AAAAAAAAAAH//4AAAAAAAAAAAAB//////4AAAAAAAAAAAAAAAAAAAAAAf///AAAAAAAAAAH//4AAAAAAAAAAAAA//////4AAAAAAAAAAAAAAAAAAAAAAf//+AAAAAAAAAAD//wAAAAAAAAAAAAA//////8AAAAAAAAAAAAAAAAAAAAAA///8AAAAAAAAAAB//wAAAAAAAAAAAAAf/////4AAAAAAAAAAAAAAAAAAAAAA///8AAAAAAAAAAB//gAAAAAAAAAAAAAf/////4AAAAAAAAAAAAAAAAAAAAAA///4AAAAAAAAAAA//AAAAAAAAAAAAAAP/////4AAAAAAAAAAAAAAAAAAAAAA///wAAAAAAAAAAA/+AAAAAAAAAAAAAAP+AP//wAAAAAAAAAAAAAAAAAAAAAA///gAAAAAAAAAAA/4AAAAAAAAAAAAAAf8AH//wAAAAAAAAAAAAAAAAAAAAAA///AAAAAAAAAAAAYAAAAAAAAAAAAAAAOAAF//gAAAAAAAAAAAAAAAAAAAAAB//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//gAABAAAAAAAAAAAAAAAAAAB//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/AAAAgAAAAAAAAAAAAAAAAAD//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/AAAAQAAAAAAAAAAAAAAAAAD//gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADYAAAA8AAAAAAAAAAAAAAAAAB/8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAAD/8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAAAD/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeAAADQAAAAAAAAAAAAAAAAAD/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAcAAAHAAAAAAAAAAAAAAAAAAB/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAOAAAAAAAAAAAAAAAAAAD/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAAAH+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4AAAAAAAAAAAAAAAAAAH+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAH/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP8AAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH4AwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4AAAAAAAAAAAAAAAAAAH4AAAAGAB4PwFj8AAAAAAAAAAAAAAAAAAAAAAAAADgAAAAAAAAAAAAAAAAAA//CAAD//////////wAAAAAAAAAAAAAAAAAAAAAAADgAAAAAAAAAAAAAAAAA////4Af///////////gAAAAAAAAAAAAAAAAAAAAAAz4AAAAAAAAAAAAAAAPz////8D/////////////4AAAAAAAAAAAAAAAAAAAAA/8AAAAAAAAAAA8/////////4f//////////////gAAAAAAAAAAAAAAAAAAAH9+AAAAAAAAf////////////4////////////////4AAAAAAAAAAAAAA8AAAAz+AAAAAAAB//////////////////////////////4AAAAAAAAAAAAAB+//nh/+AAAAAAAP//////////////////////////////wAAAAAAAAP///4Af/////8AAAAAAAP/////////////////////////////8AAAAAAAD/////////////gAAAAAAD//////////////////////////////wAAAAAAAH////////////wAAAAAAP///////////////////////////////wAAAAAD/////////////4AAAAAAD////////////////////////////////wAAAABx/////////////AAAAD8A/////////////////////////////////+AAAAAwB////////////gAAAH+AA///////////////////////////////+AAAAAAAAH////////////AfA/wAA///////////////////////////////8AAAAAAAf//////////////4ADA//////////////////////////////////AAAAAAAH///////////////g////////////////////////////////////4AAAAAAH/////////////////////////////////////////////////////gA//gAAH///////////////////////////////////////////////////////////D//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////";
const MW = 360, MH = 180;
const bytes = Uint8Array.from(atob(MASK_B64), c => c.charCodeAt(0));
const isLand = (lat, lon) => {
  const x = Math.min(MW-1, Math.max(0, Math.floor((lon+180)/360*MW)));
  const y = Math.min(MH-1, Math.max(0, Math.floor((90-lat)/180*MH)));
  const i = y*MW + x;
  return (bytes[i>>3] >> (7-(i&7))) & 1;
};

// Fibonacci sphere dots (unit vectors in lat/lon space)
const N = 7000, dots = [];
for (let i=0;i<N;i++){
  const t = (i+0.5)/N, lat = Math.asin(1-2*t), lon = ((Math.PI*(1+Math.sqrt(5))*(i+0.5)) % (2*Math.PI)) - Math.PI;
  const latD = lat*180/Math.PI, lonD = lon*180/Math.PI;
  dots.push({ x:Math.cos(lat)*Math.sin(lon), y:Math.sin(lat), z:Math.cos(lat)*Math.cos(lon), land:isLand(latD, lonD) });
}
const toVec = (latD, lonD) => { const la=latD*Math.PI/180, lo=lonD*Math.PI/180; return {x:Math.cos(la)*Math.sin(lo), y:Math.sin(la), z:Math.cos(la)*Math.cos(lo)}; };
const markers = MARKERS.map(([n,la,lo]) => ({ name:n, v:toVec(la,lo) }));

const canvas = document.getElementById("g"), ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let size, R, cx, cy, dpr;
const resize = () => {
  dpr = Math.min(window.devicePixelRatio||1, 2);
  const r = canvas.getBoundingClientRect(); size = r.width;
  canvas.width = canvas.height = Math.round(size*dpr);
  cx = cy = size/2; R = size*0.36*zoom;
};

const HOME = { yaw:-1.28, pitch:0.35, zoom:1 };  // starts near India
let yaw = HOME.yaw, pitch = HOME.pitch, zoom = HOME.zoom;
let vyaw = 0, spinning = true, dragging = false, lastX=0, lastY=0, lastMove=0;
const AUTO = 0.0045;

const project = (p) => {
  const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x = p.x*cy_ + p.z*sy, z = -p.x*sy + p.z*cy_, y = p.y;
  const y2 = y*cp - z*sp, z2 = y*sp + z*cp;
  return { x, y:y2, z:z2 };
};

let hover = null, mouse = null;
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  R = size*0.36*zoom;

  // atmosphere glow
  const g = ctx.createRadialGradient(cx,cy,R*0.92,cx,cy,R*1.35);
  g.addColorStop(0,"rgba(58,160,255,.55)"); g.addColorStop(1,"rgba(58,160,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,R*1.35,0,7); ctx.fill();
  // ocean body
  const b = ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  b.addColorStop(0,"#13306b"); b.addColorStop(1,"#071230");
  ctx.fillStyle = b; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();

  // dots, back-to-front
  const pts = [];
  for (const d of dots){ const q = project(d); if (q.z > 0) pts.push([q, d.land]); }
  pts.sort((a,b)=>a[0].z-b[0].z);
  const lx=-0.5, ly=0.6, lz=0.62;
  for (const [q, land] of pts){
    const sh = Math.max(0, q.x*lx + q.y*ly + q.z*lz), e = Math.sqrt(q.z);
    const r = (land ? 1.5 : 0.7) * (0.6+0.4*e) * (size/400) * Math.sqrt(zoom);
    ctx.fillStyle = land ? `rgb(${90+100*sh|0},${210+45*sh|0},${170+70*sh|0})` : `rgb(${20+20*sh|0},${60+50*sh|0},${130+70*sh|0})`;
    ctx.beginPath(); ctx.arc(cx+q.x*R, cy-q.y*R, r, 0, 7); ctx.fill();
  }

  // markers
  hover = null; const t = performance.now()/1000;
  for (const m of markers){
    const q = project(m.v); if (q.z <= 0.05) continue;
    const X = cx+q.x*R, Y = cy-q.y*R, pulse = (t*0.8)%1;
    ctx.strokeStyle = `rgba(255,200,90,${1-pulse})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X,Y,4+pulse*14,0,7); ctx.stroke();
    ctx.fillStyle = "#ffcf5a"; ctx.beginPath(); ctx.arc(X,Y,3.6,0,7); ctx.fill();
    if (mouse && Math.hypot(mouse.x-X, mouse.y-Y) < 12) hover = {m, X, Y};
  }
  if (hover){ tip.textContent = hover.m.name; tip.style.left = hover.X+"px"; tip.style.top = hover.Y+"px"; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
}

function loop(){
  if (!dragging){
    if (Math.abs(vyaw) > 0.00005){ yaw += vyaw; vyaw *= 0.95; }
    else if (spinning && performance.now()-lastMove > 1200) yaw += AUTO;
  }
  draw(); requestAnimationFrame(loop);
}

const pos = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
canvas.addEventListener("pointerdown", e => { dragging = true; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); lastX=e.clientX; lastY=e.clientY; vyaw=0; });
canvas.addEventListener("pointermove", e => {
  mouse = pos(e);
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  const k = 0.006/zoom; yaw += dx*k; vyaw = dx*k; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy*k)); lastMove = performance.now();
});
const end = () => { dragging = false; canvas.classList.remove("drag"); lastMove = performance.now(); };
canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
canvas.addEventListener("pointerleave", () => { mouse = null; });
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.7, Math.min(2.2, zoom*(e.deltaY<0?1.08:1/1.08))); }, {passive:false});

// pinch zoom
const ptrs = new Map(); let pd = 0;
canvas.addEventListener("pointerdown", e => ptrs.set(e.pointerId, e));
canvas.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); if (pd) zoom = Math.max(0.7, Math.min(2.2, zoom*d/pd)); pd = d; } });
const clr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pd = 0; };
canvas.addEventListener("pointerup", clr); canvas.addEventListener("pointercancel", clr);

document.getElementById("spin").onclick = e => { spinning = !spinning; e.target.textContent = spinning ? "Pause spin" : "Resume spin"; };
document.getElementById("reset").onclick = () => { yaw = HOME.yaw; pitch = HOME.pitch; zoom = HOME.zoom; vyaw = 0; };
window.addEventListener("resize", resize);
resize(); lastMove = performance.now(); loop();
</script>
</body>
</html>
